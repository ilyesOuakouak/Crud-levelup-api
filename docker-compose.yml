version: '3.8'

services:
    nginx:
        image: nginx:latest
        container_name: nginx
        restart: always
        ports:
            - "80:80"
        volumes:
            # Mount project files (read-only for security)
            - .:/var/www/html:ro
            # Mount Nginx configuration
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
        networks:
            - app_network

    php:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: php
        restart: always
        expose:
            - "9000"
        volumes:
            - .:/var/www/html
        env_file:
            - .env
        networks:
            - app_network

    mysql:
        image: mysql:8
        container_name: mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: SeniorLevelUp
            MYSQL_USER: symfony
            MYSQL_PASSWORD: symfony
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "3306:3306"
        networks:
            - app_network

    redis:
        image: redis:alpine
        container_name: redis
        restart: always
        ports:
            - "6379:6379"
        networks:
            - app_network

volumes:
    db_data:

networks:
    app_network:
        driver: bridge
